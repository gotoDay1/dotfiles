# sheldon の設定 (https://sheldon.cli.rs)
#
# 起動を軽くするため、表示に関わらないプラグインは zsh-defer で遅延ロードする
# (プロンプトが出たあと、入力待ちの間に読み込まれる)。
# zsh-defer は defer テンプレートを使うプラグインより前に書くこと。

shell = "zsh"

[templates]
defer = """
zsh-defer -c "$(cat <<'SHELDON_DEFER'
{{ hooks?.pre | nl }}{% for file in files %}source "{{ file }}"
{% endfor %}{{ hooks?.post | nl }}SHELDON_DEFER
)"
"""

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# 補完定義を fpath に追加するだけなので遅延させない (compinit より前に必要)
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]

# Ctrl-R の履歴検索 (fzf より優先するよう .zshrc でキーを割り当て直している)
[plugins.history-search-multi-word]
github = "zdharma/history-search-multi-word"

[plugins.zsh-abbr]
github = "olets/zsh-abbr"

# 他のウィジェットより後に読み込む必要があるので最後に置く
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["defer"]
