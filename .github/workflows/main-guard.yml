name: main-guard

# main へは develop からの PR だけを許可する。
# GitHub のブランチ保護 (main) で、このチェックを必須にすること。
on:
  pull_request:
    branches: [main]

jobs:
  only-from-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::main へは develop からのみマージできます (source: ${{ github.head_ref }})"
            exit 1
          fi
