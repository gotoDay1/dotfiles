name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh tmux lua5.4

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh linux/*.sh macos/*.sh

      - name: zsh syntax
        run: |
          zsh -n .zshrc
          for f in .zsh/*.zsh; do zsh -n "$f"; done

      - name: lua syntax
        run: |
          find .config/nvim .config/wezterm windows/nvim -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.4 -p

      - name: tmux config
        run: tmux -f .tmux.conf -L ci new-session -d \; kill-server

      - name: install.sh dry-run
        run: ./install.sh --dry-run --no-deps
