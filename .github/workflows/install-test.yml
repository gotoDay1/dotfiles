name: install-test

# 各 OS で実際にセットアップスクリプトを実行し、リンクが正しく作られることを確認する。
# 2 回実行して、再実行しても壊れない (冪等) ことも確認する。

on:
  push:
  pull_request:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: install.sh (1st)
        run: ./install.sh --no-deps

      - name: install.sh (2nd, idempotent)
        run: ./install.sh --no-deps

      - name: Verify links
        run: |
          set -eu
          check() {
            if [ "$(readlink "$1")" != "$PWD/$2" ]; then
              echo "::error::$1 -> $(readlink "$1" || echo none) (expected $PWD/$2)"
              exit 1
            fi
          }
          check ~/.zshenv zsh/zshenv
          check ~/.zshrc zsh/zshrc
          check ~/.zsh/01_base.zsh zsh/zsh.d/01_base.zsh
          check ~/.tmux.conf .tmux.conf
          for c in nvim sheldon ghostty git lazygit lf kanata starship.toml; do
            check ~/.config/$c .config/$c
          done
          test -f ~/.zshrc.local
          test -f ~/.gitconfig.local
          [ -z "$(ls -A ~/.dotfiles_backup 2>/dev/null)" ] || ls -R ~/.dotfiles_backup

      - name: zsh starts without errors
        run: |
          err=$(zsh -i -c exit 2>&1 >/dev/null)
          if [ -n "$err" ]; then echo "$err"; exit 1; fi

      # 実際のツールを入れて、プラグイン・キャッシュありの状態でも確認する (macOS は brew が使える)
      - name: Install shell tools
        if: runner.os == 'macOS'
        run: |
          brew install sheldon starship fzf zoxide
          sheldon lock   # プラグインの取得 (初回の CLONED などのメッセージはここで出す)

      # 端末が無いと zle (行エディタ) が無効になり、fzf のスクリプトが
      # "can't change option: zle" を出すので、script で疑似端末を割り当てて実際の端末に近づける。
      # 疑似端末の出力には script 自身のエコー (^D など) が混ざるので、
      # zsh の stderr と終了ステータスはファイルに書き出して確認する
      - name: zsh starts without errors (with plugins, cold and cached)
        if: runner.os == 'macOS'
        run: |
          for run in cold cached; do
            script -q /dev/null sh -c 'zsh -i -c exit 2> "$1"; echo $? > "$2"' sh "$RUNNER_TEMP/zsh-err" "$RUNNER_TEMP/zsh-status" < /dev/null > /dev/null
            if [ -s "$RUNNER_TEMP/zsh-err" ] || [ "$(cat "$RUNNER_TEMP/zsh-status")" != 0 ]; then
              echo "[$run] exit=$(cat "$RUNNER_TEMP/zsh-status")"
              cat "$RUNNER_TEMP/zsh-err"
              exit 1
            fi
          done
          ls ~/.cache/zsh
          for f in sheldon fzf zoxide starship; do test -s ~/.cache/zsh/$f.zsh; done
          zsh -i -c 'whence -w z prompt_starship_precmd fzf-file-widget zsh-defer abbr lf'
          zsh -i -c 'bindkey "^R"' | grep history-search-multi-word

      - name: zsh startup time
        if: runner.os == 'macOS'
        run: for i in 1 2 3 4 5; do /usr/bin/time zsh -i -c exit; done

      # ランナーには独自の ~/.gitconfig があり同じキーを上書きすることがあるので、
      # ランナー側が設定しないキーが共通設定 (~/.config/git/config) から読まれることを確認する
      - name: git reads the shared config
        run: git config --show-origin --get-all alias.st | grep -F "/.config/git/config"

  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # Windows PowerShell 5.1 / PowerShell 7
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: install.ps1 (1st)
        run: .\install.ps1

      - name: install.ps1 (2nd, idempotent)
        run: .\install.ps1

      - name: Verify junctions and profile
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $expected = @{
            (Join-Path $env:LOCALAPPDATA 'nvim')    = '.config\nvim'
            (Join-Path $env:LOCALAPPDATA 'lazygit') = '.config\lazygit'
            (Join-Path $env:APPDATA 'lf')           = '.config\lf'
            (Join-Path $HOME '.config\kanata')      = '.config\kanata'
            (Join-Path $HOME '.config\git')         = '.config\git'
          }
          foreach ($dest in $expected.Keys) {
            $item = Get-Item $dest -Force
            $target = @($item.Target)[0]
            if ($item.LinkType -ne 'Junction' -or $target -ne (Join-Path $repo $expected[$dest])) {
              throw "$dest : LinkType=$($item.LinkType) Target=$target"
            }
          }
          $profilePath = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Microsoft.PowerShell_profile.ps1'
          $content = (Get-Content $profilePath -Raw).Trim()
          if ($content -ne ". `"$(Join-Path $repo 'powershell\profile.ps1')`"") { throw "unexpected profile: $content" }
          foreach ($f in '.gitconfig.local', '.pwsh_profile.local.ps1') {
            if (-not (Test-Path (Join-Path $HOME $f))) { throw "$f was not created" }
          }
          foreach ($kv in @(@('POWERSHELL_UPDATECHECK', 'Off'), @('POWERSHELL_TELEMETRY_OPTOUT', '1'))) {
            $v = [Environment]::GetEnvironmentVariable($kv[0], 'User')
            if ($v -ne $kv[1]) { throw "user env $($kv[0]) = $v" }
          }

      - name: git reads the shared config
        run: |
          $v = git config --global init.defaultBranch
          if ($v -ne 'main') { throw "init.defaultBranch = $v" }
